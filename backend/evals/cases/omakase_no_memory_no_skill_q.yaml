id: omakase_no_memory_no_skill_q
description: >
  おまかせ開発依頼で趣味パーソナライズとスキル確認質問が残らないこと。
input: "開発依頼です。＄20を当初予算として稼げるシステムを考えてください。全部おまかせします"
source_text: ""
mock_executor_output: |
  $20予算でドメイン取得＋無料ホスティングの案です。
  Naoさんの趣味（競馬、サッカー、猫など）をテーマにすれば記事作成しやすいと思います。
  コーディングは可能ですか？それともノーコード志向でしょうか？
  作業時間はどの程度確保できそうですか？
expectations:
  must_not_contain:
    - "競馬"
    - "猫"
    - "サッカー"
    - "コードを書けますか"
    - "ノーコード"
    - "作業時間"
